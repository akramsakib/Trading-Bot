name: Gold 15m Signal

on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch: {}

# Don't pile up runs if one is slow
concurrency:
  group: gold-signal
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Analyse and notify
        env:
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_CONF: "4"
          # --- Scalp profile (see README). Empty values fall back to defaults. ---
          HOLD_MIN: ${{ vars.HOLD_MIN }}          # default 5 minutes
          HOLD_MAX: ${{ vars.HOLD_MAX }}          # default 16 minutes
          SPREAD_USD: ${{ vars.SPREAD_USD }}      # default 0.40 USD/oz
          MIN_NET_RR: ${{ vars.MIN_NET_RR }}      # default 1.0 after costs
          ATR_SL: ${{ vars.ATR_SL }}              # default 0.5 x ATR
          ATR_TP: ${{ vars.ATR_TP }}              # default 0.75 x ATR
          USE_M5: ${{ vars.USE_M5 }}              # default 1 (5m confirmation)
          # Optional repository variables (Settings -> Secrets and variables ->
          # Actions -> Variables). An empty value falls back to the default.
          KIMI_MODEL: ${{ vars.KIMI_MODEL }}
          KIMI_MAX_TOKENS: ${{ vars.KIMI_MAX_TOKENS }}
          KIMI_THINKING: ${{ vars.KIMI_THINKING }}
          # Prints sanitised Kimi diagnostics (status, finish_reason, token use).
          KIMI_DEBUG: "1"
        run: python signal.py
